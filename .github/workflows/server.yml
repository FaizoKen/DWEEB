name: Server

# Backend (Rust/axum proxy) CI. Mirrors `web.yml` but for `server/`: runs only
# when server files change, so frontend-only commits skip it entirely.
# `workflow_dispatch` lets you re-run from the Actions tab without a new commit.
on:
  push:
    branches: [main]
    paths: &server-paths
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    branches: [main]
    paths: *server-paths
  workflow_dispatch:

# Minimum-needed permissions. We only read the source.
permissions:
  contents: read

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Every Cargo command runs inside server/, where the manifest lives.
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to the stable toolchain and pull in the components the checks need.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache the registry, git deps, and target/ keyed on Cargo.lock so reruns
      # skip recompiling unchanged dependencies. Scoped to the server/ workspace.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format check
        run: cargo fmt --all --check

      # `-D warnings` turns every clippy lint into a hard failure, matching the
      # zero-warning bar the frontend typecheck holds.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      # The MCP endpoint's wiring — routes mounted, discovery documents correct,
      # the 401 that bootstraps a client, the authorization refusals, and the
      # feature gate — cannot be reached from a unit test without an
      # eighty-field `AppState` fixture and process-global env mutation, which
      # this crate deliberately avoids. So it is checked against the real binary
      # over real HTTP. Nothing here talks to Discord.
      - name: MCP endpoint smoke test
        run: bash ops/mcp-smoke.sh ./target/debug/dweeb-proxy

      # The log alerter decides which of this service's log lines wake the
      # maintainer, so a regression in it is *silent* — the 2026-08-12 parser
      # change stopped every frontend crash beacon from paging and nobody found
      # out for four weeks. It is the only component on the paging path that had
      # no automated gate at all (it ships by hand, not through CD), yet its
      # `--parse-test` is stdlib-only, offline, and runs in under a second. There
      # is no reason for it not to run here.
      - name: Log-alerter parse test
        run: python3 ops/alerts/dweeb-log-alerts.py --parse-test
