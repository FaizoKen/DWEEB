name: MCP

# CI for the MCP server (`mcp/`), which speaks the Model Context Protocol over
# stdio and is a shell around `src/core` (see docs/mcp.md).
#
# It has its own workflow rather than riding `web.yml` for one reason: an
# `mcp/`-only change should not rebuild and redeploy the website. A deploy
# replaces every hashed chunk on GitHub Pages, which is a real (if self-healing)
# cost for open tabs — see the deploy-skew notes in AGENTS.md.
#
# The other direction is already covered: `bun run typecheck` and `bun run test`
# include this package, so a `src/core` change that breaks the server fails
# `web.yml` on the commit that made it.
on:
  push:
    branches: [main]
    paths: &mcp-paths
      - "mcp/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    branches: [main]
    paths: *mcp-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned exact version for the same reason as web.yml: `latest` makes
      # setup-bun list tags via api.github.com, which fails intermittently.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The suite above runs under Vitest, which resolves the `@/…` alias
      # through Vite. The real server resolves it through Bun's own reading of
      # tsconfig.json — a different code path, and the one users actually hit.
      # These two steps run the actual entry point, so a resolution or boot
      # failure cannot pass CI just because Vitest papered over it.
      - name: Boot the server
        run: bun run mcp:check

      - name: Handshake over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_template","arguments":{"id":"welcome"}}}' \
            | bun run mcp > handshake.txt
          grep -q '"protocolVersion":"2025-06-18"' handshake.txt
          grep -q '"serverInfo"' handshake.txt
          grep -q 'Welcome' handshake.txt
          # Exactly two responses: the notification must not be answered.
          test "$(grep -c '"jsonrpc"' handshake.txt)" = "2"
